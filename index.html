<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi plata</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi plata">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1322">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
--bg:#0B1322;--surface:#152036;--surface2:#1C2940;--line:#243350;--ink:#F5F1EA;--muted:#9AA8BD;
--ivory:#F5F1EA;--navy:#0A1120;
--s1:#10C9A3;--s2:#3F7BFF;--s3:#8C5CF7;--s4:#FFB524;
--s1d:#07977B;--s2d:#2453D9;--s3d:#6436D6;--s4d:#F08A0C;
--coral:#FF7A45;--coral-glow:rgba(255,122,69,.45);--pos:#4BE3AC;--neg:#FF6B6B;--neg-bg:rgba(255,107,107,.14);--tip-bg:#152036;
--front:#F5F1EA;--front-ink:#0A1120;--front-muted:#5D6878;--front-line:#CFCBC2;--btn:#F5F1EA;--btn-ink:#0A1120;--spot:rgba(120,150,230,.18);--bg-top:#15213A;--grain:.07;
--blob-a:rgba(16,201,163,.42);--blob-b:rgba(63,123,255,.45);--blob-c:rgba(140,92,247,.42);--blob-d:rgba(255,122,69,.30);--dots:rgba(255,255,255,.045);
--shadow:0 -4px 14px rgba(0,0,0,.28)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#E8ECF2;--surface:#FFFFFF;--surface2:#F4F6FA;--line:#DCE1EA;--ink:#0A1120;--muted:#5D6878;--pos:#0E9C73;--neg:#E0413A;--neg-bg:rgba(224,65,58,.1);--tip-bg:#FFFFFF;--front:#0A1120;--front-ink:#F5F1EA;--front-muted:#A9B4C4;--front-line:#2C3B55;--btn:#0A1120;--btn-ink:#F5F1EA;--spot:rgba(255,255,255,.95);--bg-top:#F8F9FC;--grain:.04;--blob-a:rgba(16,201,163,.28);--blob-b:rgba(63,123,255,.24);--blob-c:rgba(140,92,247,.22);--blob-d:rgba(255,122,69,.2);--dots:rgba(10,17,32,.05);--shadow:0 -4px 14px rgba(14,23,38,.16)}}
:root[data-theme="light"]{--bg:#E8ECF2;--surface:#FFFFFF;--surface2:#F4F6FA;--line:#DCE1EA;--ink:#0A1120;--muted:#5D6878;--pos:#0E9C73;--neg:#E0413A;--neg-bg:rgba(224,65,58,.1);--tip-bg:#FFFFFF;--front:#0A1120;--front-ink:#F5F1EA;--front-muted:#A9B4C4;--front-line:#2C3B55;--btn:#0A1120;--btn-ink:#F5F1EA;--spot:rgba(255,255,255,.95);--bg-top:#F8F9FC;--grain:.04;--blob-a:rgba(16,201,163,.28);--blob-b:rgba(63,123,255,.24);--blob-c:rgba(140,92,247,.22);--blob-d:rgba(255,122,69,.2);--dots:rgba(10,17,32,.05);--shadow:0 -4px 14px rgba(14,23,38,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}html,body{margin:0;color:var(--ink)}body{background:transparent}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;font-size:16px;font-variant-numeric:tabular-nums}
main{max-width:460px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--s2);outline-offset:2px}
.small{font-size:.86rem;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
.top h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin:0}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.8rem;color:var(--muted)}
.plus{width:40px;height:40px;border-radius:50%;border:0;background:var(--coral);color:#0E1726;font-size:1.5rem;font-weight:700;display:grid;place-items:center;line-height:1}
h2{font-size:1.55rem;font-weight:800;letter-spacing:-.025em;margin:0 0 4px;line-height:1.1}
h3{font-size:1rem;font-weight:700;margin:26px 0 10px;color:var(--muted)}
.amount{font-weight:800;letter-spacing:-.035em;line-height:1}
.label{font-size:1.05rem;margin-top:20px}
.hoy{font-size:clamp(3.2rem,17vw,4.2rem)}
/* pila de tarjetas */
.stack{position:relative;margin-top:16px}
.sc{position:absolute;left:0;right:0;height:170px;border:0;border-radius:20px;padding:15px 18px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.sc{padding-top:11px!important}.sc .sc-row{display:flex;justify-content:space-between;align-items:flex-start}
.sc .nm{font-size:.9rem;font-weight:700;line-height:1.2}.sc .nm small{display:block;font-size:.76rem;font-weight:500;opacity:.8;margin-top:1px}
.sc .val{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sc.s0{background:var(--s1);color:#fff}.sc.s1{background:var(--s2);color:#fff}.sc.s2{background:var(--s3);color:#fff}.sc.s3{background:var(--s4);color:#2E2206}
.sc.next{filter:saturate(.55) brightness(.9)}
.front{position:absolute;left:0;right:0;border-radius:22px;padding:18px 18px 14px;background:var(--front);color:var(--front-ink);box-shadow:0 -12px 28px rgba(0,0,0,.4)}
.front .lab{font-size:.9rem;color:var(--front-muted)}
.front .big{font-size:clamp(3rem,15vw,3.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 4px}
.front .big.neg{color:var(--neg)}
.front .sub{font-size:.86rem;color:var(--front-muted)}
.front .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;border-top:1px dashed var(--front-line);padding-top:10px}
.front .meta>*{background:none;border:0;padding:0;text-align:left;font-size:.78rem;color:var(--front-muted)}
.front .meta b{display:block;color:var(--front-ink);font-size:.95rem;font-weight:700}
.note{font-size:.82rem;color:var(--muted);text-align:center;margin-top:10px}
.hint{background:var(--tip-bg);border:1px solid var(--line);border-left:4px solid var(--s4);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:.93rem}
.warn{background:var(--neg-bg);color:var(--neg);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.93rem}
.bigbtn{display:block;width:100%;margin-top:18px;border:0;border-radius:16px;padding:18px;font-weight:700;font-size:1.1rem;background:var(--coral);color:#0E1726}
.btn{display:block;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600;background:var(--surface)}
.back{background:none;border:0;padding:6px 0;font-weight:600;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav div{display:grid;grid-template-columns:repeat(3,1fr);max-width:460px;width:100%}
nav button{background:none;border:0;padding:6px;font-size:.76rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
nav button span{font-size:1.25rem;line-height:1.1;filter:grayscale(1);opacity:.7}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] span{filter:none;opacity:1}
nav button[aria-current="page"]:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--s1);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0}
.row+.row{border-top:1px solid var(--line)}
.row span:first-child{color:var(--muted)}
.row.total{font-weight:800;font-size:1.08rem}
.row.total span:first-child{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
/* sobre abierto */
.bigenv{position:relative;margin-top:14px;border-radius:22px;padding:18px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.bigenv.w0{background:var(--s1);color:#fff}.bigenv.w1{background:var(--s2);color:#fff}.bigenv.w2{background:var(--s3);color:#fff}.bigenv.free{background:var(--s4);color:#2E2206}
.bigenv .inner .small{color:inherit;opacity:.85}
.bigenv .inner .amount{font-size:3rem;margin:6px 0 2px}
.bigenv .foot{margin-top:16px;padding-top:10px;border-top:1px solid rgba(255,255,255,.35);font-size:.92rem}
.bigenv.free .foot{border-top-color:rgba(46,34,6,.25)}
.bills{display:flex;flex-direction:column;gap:6px}
.bill{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line)}
.bill.past .a{text-decoration:line-through;color:var(--muted)}
.bill.ok{box-shadow:inset 4px 0 0 var(--pos)}
.bill.over{box-shadow:inset 4px 0 0 var(--neg)}
.bill.today{background:var(--front);color:var(--front-ink);border-color:transparent}
.bill small{display:block;color:inherit;opacity:.7}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .d{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.list .d:after{content:'Tocá para editar';display:none}
.list .d div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;padding:2px 8px}
.empty{color:var(--muted);text-align:center;padding:14px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--s1)}
.bar i.r{background:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:9px 13px;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px;margin:0 6px 6px 0;font-size:.88rem}
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
label.f{display:block;font-size:.88rem;color:var(--muted);margin:14px 0 6px}
input[type=number],input[type=text],input[type=date]{width:100%;font:inherit;font-size:1.05rem;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);-webkit-appearance:none;appearance:none;min-height:48px}
input.big{font-size:2.1rem;font-weight:800;padding:8px 12px;letter-spacing:-.03em}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.93rem}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--s1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.envs{position:relative;height:160px;margin-top:14px}
.envs div{position:absolute;left:0;right:0;height:110px;border-radius:16px;padding:10px 14px;font-size:.84rem;display:flex;justify-content:space-between;box-shadow:var(--shadow)}
.envs div b{font-size:.95rem}
.envs div:nth-child(1){top:0;background:var(--s1);color:#fff}.envs div:nth-child(2){top:16px;background:var(--s2);color:#fff}.envs div:nth-child(3){top:32px;background:var(--s3);color:#fff}.envs div:nth-child(4){top:48px;background:var(--s4);color:#2E2206}
.toast{pointer-events:none;position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ivory);color:var(--navy);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:30;display:none;max-width:90vw;text-align:center;font-weight:600}
.hero-cierre{background:var(--front);color:var(--front-ink);border-radius:22px;padding:20px 18px;margin-top:12px}
.hero-cierre .amount{font-size:3rem;margin:6px 0;color:var(--pos)}
.hero-cierre.neg .amount{color:var(--neg)}
.hero-cierre>div:first-child,.hero-cierre>div:last-child{color:var(--front-muted)}
.up{color:var(--pos)}.down{color:var(--neg)}
.month{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:8px}
.savings{margin-top:14px;border-radius:22px;padding:20px 18px;background:var(--s1);color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.savings .amount{font-size:clamp(2.6rem,13vw,3.2rem);margin-top:6px}
/* tarjeta de crédito */
.cc{position:relative;aspect-ratio:1.586;border-radius:20px;padding:18px 20px;color:#F3EFE7;background:#1B2A45;box-shadow:0 14px 32px rgba(0,0,0,.35);overflow:hidden;margin-top:14px;display:flex;flex-direction:column;border:1px solid #2F4265}
.cc:before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(230,178,74,.14)}
.cc>*{position:relative}
.cc .head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.9rem;color:#E6B24A}
.cc .visa{font-style:italic;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;color:#F3EFE7}
.chip-cc{width:42px;height:31px;border-radius:7px;background:#E6B24A;margin-top:12px;position:relative;opacity:.9}
.chip-cc:before{content:"";position:absolute;inset:9px 0;border-top:1px solid rgba(46,34,6,.4);border-bottom:1px solid rgba(46,34,6,.4)}
.cc .due{margin-top:auto}
.cc .due small{display:block;font-size:.8rem;color:#96A3B6}
.cc .due .amount{font-size:2.2rem}
.cc .num{display:flex;justify-content:space-between;font-size:.82rem;letter-spacing:.1em;margin-top:6px;color:#96A3B6}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:14px;background:var(--line);gap:2px}
.split i{display:block;height:100%}
.ring{display:flex;align-items:center;gap:16px;padding:14px 16px}
.ring svg{flex:none}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px)}to{transform:none}}.sc,.front{transition:transform .15s}.sc:active{transform:translateY(-6px)}}

/* ---- fondo ---- */
body{position:relative;min-height:100vh}
nav{background:var(--surface)}
/* ---- tarjetas con brillo ---- */
.sc.s0{background:linear-gradient(135deg,var(--s1),var(--s1d))}
.sc.s1{background:linear-gradient(135deg,var(--s2),var(--s2d))}
.sc.s2{background:linear-gradient(135deg,var(--s3),var(--s3d))}
.sc.s3{background:linear-gradient(135deg,var(--s4),var(--s4d));color:#2A1A00}
.bigenv.w0{background:linear-gradient(135deg,var(--s1),var(--s1d))}
.bigenv.w1{background:linear-gradient(135deg,var(--s2),var(--s2d))}
.bigenv.w2{background:linear-gradient(135deg,var(--s3),var(--s3d))}
.bigenv.free{background:linear-gradient(135deg,var(--s4),var(--s4d));color:#2A1A00}
.sc,.bigenv,.savings,.cc{overflow:hidden}
.sc:after,.bigenv:after,.savings:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sc>*,.bigenv>*,.savings>*{position:relative;z-index:1}
.sc.next{filter:saturate(.8) brightness(.92)}
.savings{background:linear-gradient(135deg,var(--s1),var(--s2d))}
.envs div:nth-child(1){background:linear-gradient(135deg,var(--s1),var(--s1d))}.envs div:nth-child(2){background:linear-gradient(135deg,var(--s2),var(--s2d))}.envs div:nth-child(3){background:linear-gradient(135deg,var(--s3),var(--s3d))}.envs div:nth-child(4){background:linear-gradient(135deg,var(--s4),var(--s4d));color:#2A1A00}
.bigbtn,.plus{background:var(--btn);color:var(--btn-ink);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.bigbtn.danger{background:var(--neg);color:#fff}
.panel .bigbtn{background:var(--btn);color:var(--btn-ink)}
.front{box-shadow:0 -12px 30px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.25)}
.bar i{background:linear-gradient(90deg,var(--s1),var(--s2))}
nav button[aria-current="page"]{color:var(--ink)}
/* ---- animaciones ---- */
@media (prefers-reduced-motion:no-preference){
 main.enter{animation:enter .35s cubic-bezier(.2,.8,.2,1)}
 @keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 .stack.intro .sc{animation:dealIn .6s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(var(--i)*70ms)}
 .stack.intro .front{animation:riseIn .7s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:.3s}
 @keyframes dealIn{from{opacity:0;transform:translateY(-40px) scale(.94)}to{opacity:1;transform:none}}
 @keyframes riseIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
 .sc{transition:transform .25s cubic-bezier(.2,.9,.25,1.2),filter .2s}
 .sc:hover,.sc:active{transform:translateY(-8px)}
 .front.bump{animation:bump .45s ease}
 @keyframes bump{0%{transform:scale(1)}35%{transform:scale(.97)}70%{transform:scale(1.015)}100%{transform:scale(1)}}
 .bigbtn,.btn,.plus,.chip{transition:transform .15s ease,box-shadow .2s}
 .bigbtn:active,.btn:active,.plus:active,.chip:active{transform:scale(.96)}
 .plus{animation:pulse 2.8s ease-in-out infinite}
 @keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.28),0 0 0 0 rgba(245,241,234,.35)}50%{box-shadow:0 8px 22px rgba(0,0,0,.28),0 0 0 10px rgba(245,241,234,0)}}
 .bigenv,.cc,.savings,.hero-cierre{animation:pop .5s cubic-bezier(.2,.9,.25,1.15) both}
 @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
 .bar i,.split i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
 @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
 .bill,.month,.badge{animation:enter .4s ease both}
 .bills .bill:nth-child(2),.month:nth-of-type(2){animation-delay:.05s}.bills .bill:nth-child(3){animation-delay:.1s}.bills .bill:nth-child(4){animation-delay:.15s}.bills .bill:nth-child(n+5){animation-delay:.2s}
 .sheet.open{animation:fade .2s ease}
 @keyframes fade{from{opacity:0}to{opacity:1}}
 .toast.show{animation:drop .35s cubic-bezier(.2,.9,.25,1.2)}
 @keyframes drop{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
 .cc:before{animation:spin 18s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 .ring circle.prog{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
}
</style>
</head>
<body>
<main id="root"></main>
<nav id="nav"><div>
  <button data-go="home"><span>💵</span>Hoy</button>
  <button data-go="tarjeta"><span>💳</span>Tarjeta</button>
  <button data-go="historial"><span>📈</span>Progreso</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<input type="file" id="restore" accept="application/json,.json" hidden>
<script>
(function(){
"use strict";
const KEY='mi-plata-v1';
const CATS=[['super','🛒 Súper'],['transporte','🚌 Transporte'],['comida','🍔 Comida'],['salidas','🎉 Salidas'],['salud','💊 Salud'],['otro','✏️ Otro']];
const CATNAME=Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
const TIPOS=[['luz','Luz'],['tel','Teléfono e internet'],['otra','Otra cosa']];
const PCT=[.15,.20,.25,.40];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

try{const l=JSON.parse(localStorage.getItem(KEY)||'null');if(l&&l.v===1)S=Object.assign(S,l);}catch(e){}

const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('es-AR');
const miles=n=>Math.round(n||0).toLocaleString('es-AR');
const num=sel=>Number((($(sel)||{}).value||'').replace(/\D/g,''))||0;
const r100=n=>Math.round(n/100)*100;
const r1000=n=>Math.round(n/1000)*1000;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const diff=(a,b)=>Math.round((b-a)/864e5);
const corto=d=>d.getDate()+' '+MESES[d.getMonth()].slice(0,3);
const largo=d=>{const s=DIAS[d.getDay()];return s[0].toUpperCase()+s.slice(1)+' '+d.getDate()+' de '+MESES[d.getMonth()];};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hoyD(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600);}
function cuotasPlan(){const t=hoyD();return Math.max(0,(2027*12+2)-(t.getFullYear()*12+t.getMonth())+1);}

/* ---------- Cálculos del mes ---------- */
function semanas(c){
  const ini=pd(c.inicio),last=add(pd(c.fin),-1);
  return [0,1,2,3].map(i=>{
    const desde=add(ini,i*7);let hasta=i<3?add(ini,i*7+6):last;
    if(hasta>last)hasta=last;
    return {i,desde,hasta,dias:Math.max(1,diff(desde,hasta)+1)};
  });
}
function semanaDe(c,f){const ws=semanas(c),d=pd(f);for(const w of ws)if(d>=w.desde&&d<=w.hasta)return w.i;return d<ws[0].desde?0:3;}

function sim(c,hasta){
  const t=hasta||hoyD(),ws=semanas(c),last=add(pd(c.fin),-1);
  const plata=c.gastos.filter(g=>g.medio==='plata');
  const imp=plata.filter(g=>g.imp).reduce((a,g)=>a+g.m,0);
  const porDia={};plata.filter(g=>!g.imp).forEach(g=>{porDia[g.f]=(porDia[g.f]||0)+g.m;});
  const gastSem=[0,0,0,0];plata.filter(g=>!g.imp).forEach(g=>{gastSem[semanaDe(c,g.f)]+=g.m;});
  let alcCerrada=0,pasados=0;const out=[];const dias=[];
  let actual=ws.findIndex(w=>t>=w.desde&&t<=w.hasta);
  const antes=t<ws[0].desde,despues=t>last;
  if(antes)actual=-1;if(despues)actual=4;
  for(const w of ws){
    const terminada=w.hasta<t;
    let tope=w.i<3?c.topes[w.i]:c.topes[3]-pasados-imp;
    const bal=tope-gastSem[w.i];
    if(terminada){if(bal>=0)alcCerrada+=bal;else if(w.i<3)pasados+=-bal;}
    const estado=terminada?'done':w.i===actual?'now':'next';
    // días
    let antesDia=0,progreso=0;
    if(w.desde<=t){
      for(let k=0;k<w.dias;k++){
        const d=add(w.desde,k);if(d>t)break;
        const f=iso(d),g=porDia[f]||0;
        const permitido=Math.max(0,(tope-antesDia)/(w.dias-k));
        dias.push({f,sem:w.i,permitido,gasto:g,ok:g<=permitido+1,hoy:diff(d,t)===0});
        if(estado==='now'&&d<t)progreso+=tope/w.dias-g;
        antesDia+=g;
      }
    }
    out.push({...w,tope,gastado:gastSem[w.i],queda:bal,estado,progreso});
  }
  const cur=actual>=0&&actual<4?out[actual]:null;
  const hoyRec=dias.find(d=>d.hoy)||null;
  const progresoSem=cur?cur.progreso:0;
  const alcancia=alcCerrada+Math.max(0,progresoSem);
  const completados=dias.filter(d=>!d.hoy);
  let racha=0;for(let i=completados.length-1;i>=0;i--){if(completados[i].ok&&completados[i].gasto>=0)racha++;else break;}
  return {ws:out,cur,actual,antes,despues,dias,hoyRec,alcancia,alcCerrada,imp,racha,completados};
}

function mensajes(c,r){
  const m=[];const comp=r.completados;
  const ayer=comp[comp.length-1];
  if(r.hoyRec&&r.hoyRec.gasto>r.hoyRec.permitido+1)m.push('Hoy te pasaste '+fmt(r.hoyRec.gasto-r.hoyRec.permitido)+'. Mañana arrancás de nuevo, no pasa nada.');
  if(ayer&&ayer.permitido-ayer.gasto>=100)m.push('Ayer gastaste '+fmt(ayer.gasto)+' y te sobraron '+fmt(ayer.permitido-ayer.gasto)+'. Eso ya es ahorro.');
  if(r.racha>=2)m.push(r.racha+' días seguidos gastando menos que tu número. Seguí así.');
  const prom=comp.length?r.alcancia/comp.length:0;
  if(prom>=300){const p=r100(prom);m.push('Venís ahorrando unos '+fmt(p)+' por día. Así, en un año tendrías '+fmt(p*365)+'.');}
  if(r.alcancia>=40000)m.push('Con lo que llevás ahorrado ya pagás un mes de teléfono e internet.');
  if(S.historial.length){const prev=S.historial[S.historial.length-1];if(r.alcancia>prev.ahorro&&prev.ahorro>0)m.push('Ya ahorraste más que en todo el mes pasado.');}
  if(!m.length)m.push('Si ahorrás $1.000 por día, en un año tenés $365.000. Con $5.000 por día, $1.825.000.');
  return m;
}

let view='home',param=null;
function go(v,p){view=v;param=p==null?null:p;render();window.scrollTo(0,0);}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

let introHecho=false,lastView='',counts={};
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function postRender(){
  const R=$('#root');
  if(view!==lastView){R.classList.remove('enter');void R.offsetWidth;R.classList.add('enter');lastView=view;}
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=Number(el.dataset.count),k=el.dataset.key,from=counts[k]==null?0:counts[k];counts[k]=to;
    if(reduceMotion()||from===to){el.textContent=fmt(to);return;}
    const t0=performance.now(),dur=from===0?900:650;
    const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
  const st=document.querySelector('.stack.intro');if(st)setTimeout(()=>st.classList.remove('intro'),1300);
  document.querySelectorAll('circle.prog[data-off]').forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>c.setAttribute('stroke-dashoffset',c.dataset.off))));
}
function render(){
  renderInner();postRender();
}
function renderInner(){
  const nav={home:'home',sobre:'home',tarjeta:'tarjeta',historial:'historial',cierre:'historial',cobre:'historial'}[view];
  document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===nav?'page':'false'));
  const R=$('#root');
  if(view==='cobre')return renderCobre(R);
  if(!S.ciclo&&(view==='home'||view==='sobre'))return renderBienvenida(R);
  ({home:renderHome,sobre:renderSobre,tarjeta:renderTarjeta,historial:renderHistorial,cierre:renderCierreGuardado}[view]||renderHome)(R);
}

function renderBienvenida(R){
  R.innerHTML=`
  <div class="top"><h1>Mi plata</h1></div><div class="small">${largo(hoyD())}</div>
  <h2 style="margin-top:24px;font-size:2rem">Tu sueldo, en sobres</h2>
  <p>El día que cobrás, la app separa tu plata en cuatro sobres que van de menor a mayor. Cada día te dice cuánto podés gastar, y lo que no gastes va a tu alcancía.</p>
  <div class="envs"><div><span>Semana 1</span><b>15%</b></div><div><span>Semana 2</span><b>20%</b></div><div><span>Semana 3</span><b>25%</b></div><div><span>Sobre libre</span><b>40%</b></div></div>
  ${S.historial.length?`<p class="small" style="margin-top:14px">Tenés ${S.historial.length} mes${S.historial.length>1?'es':''} cerrado${S.historial.length>1?'s':''} en Progreso.</p>`:''}
  <button class="bigbtn" id="b-cobre">Cobré, armar mis sobres</button>
  <button class="btn" id="b-rest">Tengo una copia de seguridad</button>`;
  $('#b-cobre').onclick=()=>go('cobre');
  $('#b-rest').onclick=()=>$('#restore').click();
}

function stackCard(w){
  const nombres=['Semana 1','Semana 2','Semana 3','Sobre libre'];
  let der='',val='';
  if(w.estado==='done'){der=w.queda>=0?'✓ cerrado':'✗ pasado';val=(w.queda>=0?'+':'')+fmt(w.queda);}
  else if(w.estado==='now'){der='quedan';val=fmt(Math.max(0,w.queda));}
  else{der=(w.i<3?'🔒 ':'desde ')+corto(w.desde);val=fmt(w.tope);}
  return `<button class="sc s${w.i} ${w.estado}" style="top:${w.i*54}px;--i:${w.i}" data-sobre="${w.i}"><div class="sc-row"><span class="nm">${nombres[w.i]}<small>${der}</small></span><span class="val">${val}</span></div></button>`;
}

function renderHome(R){
  const c=S.ciclo,r=sim(c),t=hoyD();
  const total=diff(pd(c.inicio),pd(c.fin)),dia=Math.min(total,Math.max(0,diff(pd(c.inicio),t)+1));
  const tj=c.gastos.filter(g=>g.medio==='tarjeta').reduce((a,g)=>a+g.m,0)+S.baseResumen;
  let lab,big,sub,neg=false,extra='';
  if(r.antes){lab='Tus sobres arrancan el';big=corto(pd(c.inicio));sub='Faltan '+diff(t,pd(c.inicio))+' días. Mientras, gastá lo mínimo.';}
  else if(r.despues){lab='Se terminó el mes. Ahorraste';big=fmt(r.alcancia);sub='Tocá "Cobré" cuando cobres para ver tu cierre.';}
  else{
    const h=r.hoyRec,queda=h.permitido-h.gasto;neg=queda<0;
    lab='Hoy podés gastar';big=fmt(Math.max(0,queda));
    sub=h.gasto>0?'Gastaste '+fmt(h.gasto)+' de '+fmt(h.permitido):'Todavía no gastaste nada hoy';
    const msgs=mensajes(c,r);
    const luzPend=c.luz&&!c.gastos.some(g=>g.medio==='tarjeta'&&g.tipo==='luz');
    extra=(luzPend?`<div class="hint" style="border-left-color:var(--s2);display:flex;gap:12px;align-items:center;justify-content:space-between"><span>💡 Este mes te toca la luz. Pagala con la tarjeta.</span><button class="chip" id="b-luz" style="flex:none">Ya la pagué</button></div>`:'')+(neg?`<div class="warn">Te pasaste ${fmt(-queda)}. Se descuenta de los días que quedan de esta semana.</div>`:'')+`<div class="hint">${esc(msgs[t.getDate()%msgs.length])}</div>`;
  }
  const top=4*54;
  R.innerHTML=`
  <div class="top"><h1>Mi plata</h1>${r.despues?'':`<button class="plus" id="b-plus" aria-label="Anotar gasto">+</button>`}</div>
  <div class="small">${largo(t)}</div>
  <div class="stack ${introHecho?'':'intro'}" style="height:${top+198}px">
    ${r.ws.map(stackCard).join('')}
    <div class="front" style="top:${top}px">
      <div class="lab">${lab}</div>
      <div class="big ${neg?'neg':''}" ${!r.antes&&!r.despues?`data-count="${neg?0:Math.round(r.hoyRec.permitido-r.hoyRec.gasto)}" data-key="hoy"`:''}>${big}</div>
      <div class="sub">${sub}</div>
      <div class="meta">
        <button id="m-alc">Alcancía<b data-count="${Math.round(r.alcancia)}" data-key="alc">${fmt(r.alcancia)}</b></button>
        <button id="m-tj">Tarjeta<b>${fmt(tj)}</b></button>
        <span>Día<b>${r.antes?'–':dia+' de '+total}</b></span>
      </div>
    </div>
  </div>
  <div class="note">Tocá un sobre para abrirlo</div>
  ${extra}
  ${r.despues?`<button class="bigbtn" id="b-cobre">Cobré, cerrar el mes</button>`:`<button class="bigbtn" id="b-gaste">Gasté plata</button>`}
  ${(()=>{const hg=c.gastos.filter(g=>g.f===iso(t)).slice().reverse();return hg.length?`<h3>Gastos de hoy</h3><div class="card"><ul class="list">${hg.map(g=>`<li><button class="d" data-edit="${g.id}" aria-label="Editar gasto"><div>${g.medio==='tarjeta'?'💳 '+TIPOS.find(x=>x[0]===g.tipo)[1]:g.imp?'⚠️ Imprevisto'+(g.nota?', '+esc(g.nota):''):esc(CATNAME[g.cat]||'Gasto')}</div></button><b>${fmt(g.m)}</b><button class="x" data-del="${g.id}" aria-label="Borrar">×</button></li>`).join('')}</ul></div>`:'';})()}`;
  document.querySelectorAll('[data-sobre]').forEach(b=>b.onclick=()=>go('sobre',Number(b.dataset.sobre)));
  ['#b-gaste','#b-plus'].forEach(id=>{const e=$(id);if(e)e.onclick=()=>abrirGasto();});
  $('#m-alc').onclick=()=>go('historial');$('#m-tj').onclick=()=>go('tarjeta');
  const cb=$('#b-cobre');if(cb)cb.onclick=()=>go('cobre');
  const bl=$('#b-luz');if(bl)bl.onclick=()=>abrirGasto('luz');
  bindDelete();
  introHecho=true;
}

function renderSobre(R){
  const c=S.ciclo,r=sim(c),w=r.ws[param],t=hoyD();
  const nombre=w.i===3?'Sobre libre':'Semana '+(w.i+1);
  const diasSem=r.dias.filter(d=>d.sem===w.i);
  const gastos=c.gastos.filter(g=>g.medio==='plata'&&(g.imp?w.i===3:!g.imp&&semanaDe(c,g.f)===w.i)).sort((a,b)=>b.f.localeCompare(a.f)||b.id-a.id);
  let inner;
  if(w.estado==='next')inner=`<div class="small">Se abre el ${corto(w.desde)}</div><div class="amount">${fmt(w.tope)}</div>`;
  else if(w.estado==='done')inner=`<div class="small">${w.queda>=0?'Te sobraron, fueron a la alcancía':'Te pasaste, salió del sobre libre'}</div><div class="amount">${fmt(w.queda)}</div>`;
  else{const rest=diff(t,w.hasta)+1;inner=`<div class="small">Quedan en el sobre</div><div class="amount">${fmt(Math.max(0,w.queda))}</div><div class="small" style="margin-top:4px">para ${rest} día${rest>1?'s':''}</div>`;}
  R.innerHTML=`
  <button class="back" id="b-back">‹ Volver</button>
  <h2>${nombre}</h2>
  <div class="small">Del ${corto(w.desde)} al ${corto(w.hasta)}, sobre de ${fmt(w.tope)}</div>
  <div class="bigenv ${w.i===3?'free':'w'+w.i}"><div class="inner">${inner}</div>
    <div class="foot">Gastado: <b>${fmt(w.gastado)}</b>${w.i===3&&r.imp?`<br>Imprevistos: <b>${fmt(r.imp)}</b>`:''}</div></div>
  ${w.estado==='now'?`<button class="bigbtn" id="b-anotar">Gasté plata</button>`:''}
  ${w.i<3&&w.estado!=='done'?`<button class="btn" id="b-monto">Cambiar el monto de este sobre</button>`:w.i===3?`<p class="small">El sobre libre es lo que queda después de las tres semanas. Si cambiás un sobre semanal, este se ajusta solo.</p>`:''}
  ${diasSem.length?`<h3>Tus billetes por día</h3><div class="bills">${diasSem.slice().reverse().map(d=>`
    <div class="bill ${d.hoy?'today':'past '+(d.ok?'ok':'over')}"><div>${d.hoy?'Hoy':largo(pd(d.f)).split(' de ')[0]}<small>${d.hoy?'podés gastar':'gastaste '+fmt(d.gasto)}</small></div>
    <b class="a">${fmt(d.hoy?Math.max(0,d.permitido-d.gasto):d.permitido)}</b></div>`).join('')}</div>`:''}
  <h3>Gastos</h3>
  <div class="card">${gastos.length?`<ul class="list">${gastos.map(g=>`<li><button class="d" data-edit="${g.id}" aria-label="Editar gasto"><div>${esc(g.imp?'⚠️ Imprevisto':CATNAME[g.cat]||'Gasto')}${g.nota?', '+esc(g.nota):''}</div><span class="small">${corto(pd(g.f))}</span></button><b>${fmt(g.m)}</b><button class="x" data-del="${g.id}" aria-label="Borrar">×</button></li>`).join('')}</ul>`:`<div class="empty">Sin gastos todavía.</div>`}</div>`;
  $('#b-back').onclick=()=>go('home');
  const ba=$('#b-anotar');if(ba)ba.onclick=()=>abrirGasto();
  const bm=$('#b-monto');if(bm)bm.onclick=()=>cambiarMonto(w.i);
  bindDelete();
}

function bindDelete(){
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>abrirGasto(null,b.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!await ask('¿Borrar este gasto?','Se descuenta de tus sobres y no se puede deshacer.','Borrar gasto',true))return;
    S.ciclo.gastos=S.ciclo.gastos.filter(g=>String(g.id)!==b.dataset.del);save();render();toast('Gasto borrado');
  });
}

function cambiarMonto(i){
  const c=S.ciclo;
  openSheet(`<h2>Semana ${i+1}</h2><p class="small">La diferencia se ajusta con el sobre libre, que ahora tiene ${fmt(c.topes[3])}.</p>
  <label class="f" for="m-v">Nuevo monto</label><input id="m-v" class="big" type="text" inputmode="numeric" autocomplete="off" data-money value="${miles(c.topes[i])}">
  <button class="bigbtn" id="m-ok">Guardar</button><button class="btn" id="m-no">Cancelar</button>`);
  $('#m-no').onclick=closeSheet;
  $('#m-ok').onclick=()=>{
    const v=Math.max(0,num('#m-v')||0),d=v-c.topes[i];
    if(c.topes[3]-d<0){toast('No alcanza: el sobre libre quedaría en negativo.');return;}
    c.topes[i]=v;c.topes[3]-=d;save();closeSheet();render();toast('Sobre actualizado');
  };
}

/* ---------- Anotar gasto ---------- */
function abrirGasto(pre,editId){
  const ed=editId!=null?S.ciclo.gastos.find(g=>String(g.id)===String(editId)):null;
  let cat=ed&&ed.cat||'super',medio=ed?ed.medio:(pre==='tarjeta'||pre==='luz'?'tarjeta':'plata'),tipo=ed&&ed.tipo||(pre==='luz'?'luz':'luz'),imp=!!(ed&&ed.imp);
  openSheet(`<h2>${ed?'Editar gasto':medio==='tarjeta'?'Cargar en la tarjeta':'Gasté plata'}</h2>
  <label class="f" for="g-m">Cuánto</label><input id="g-m" class="big" type="text" inputmode="numeric" autocomplete="off" data-money placeholder="0" value="${ed?miles(ed.m):''}">
  <label class="f">Cómo pagaste</label>
  <div class="chips" id="g-medio"><button class="chip" data-v="plata">💵 Plata</button><button class="chip" data-v="tarjeta">💳 Tarjeta</button></div>
  <div id="g-plata"><label class="f">En qué</label><div class="chips" id="g-cat">${CATS.map(c=>`<button class="chip" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
    <label class="check"><input type="checkbox" id="g-imp" ${imp?'checked':''}><span>Fue un imprevisto. Sacalo del sobre libre, no del de esta semana.</span></label>
    <div id="g-notaw" hidden><label class="f" for="g-nota">¿Qué pasó?</label><input id="g-nota" type="text" maxlength="60" placeholder="Remedio, arreglo, regalo…" value="${ed&&ed.nota?esc(ed.nota):''}"></div></div>
  <div id="g-tarj" hidden><label class="f">¿Qué pagaste con la tarjeta?</label><div class="chips" id="g-tipo">${TIPOS.map(c=>`<button class="chip" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
    <div class="warn" id="g-warn" hidden>La tarjeta es solo para los fijos. Si podés, pagalo con la plata del sobre.</div></div>
  <label class="f" for="g-f">Fecha</label><input id="g-f" type="date" value="${ed?ed.f:iso(hoyD())}">
  <button class="bigbtn" id="g-ok">${ed?'Guardar cambios':'Anotar'}</button>
  ${ed?`<button class="btn" id="g-del" style="color:var(--neg)">Borrar gasto</button>`:''}
  <button class="btn" id="g-no">Cancelar</button>`);
  const paint=()=>{
    document.querySelectorAll('#g-medio .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===medio));
    document.querySelectorAll('#g-cat .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===cat));
    document.querySelectorAll('#g-tipo .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===tipo));
    $('#g-plata').hidden=medio!=='plata';$('#g-tarj').hidden=medio!=='tarjeta';
    $('#g-warn').hidden=tipo!=='otra';$('#g-notaw').hidden=!imp;
  };
  document.querySelectorAll('#g-medio .chip').forEach(b=>b.onclick=()=>{medio=b.dataset.v;paint();});

/* ---------- Cierre de mes ---------- */
function construirCierre(c){
  const last=add(pd(c.fin),-1),t=hoyD()<last?hoyD():last;
  const r=sim(c,t);
  const plata=c.gastos.filter(g=>g.medio==='plata');
  const gastado=plata.reduce((a,g)=>a+g.m,0);
  const ahorro=c.disponible-gastado;
  const dias=r.dias;
  let rachaMax=0,cur=0;dias.forEach(d=>{if(d.ok){cur++;rachaMax=Math.max(rachaMax,cur);}else cur=0;});
  const caro=dias.reduce((a,d)=>d.gasto>(a?a.gasto:-1)?d:a,null);
  const cats={};plata.forEach(g=>{const k=g.imp?'imprevisto':g.cat;cats[k]=(cats[k]||0)+g.m;});
  const tj=c.gastos.filter(g=>g.medio==='tarjeta');
  const prev=S.historial[S.historial.length-1]||null;
  const semanasC=r.ws.map(w=>({tope:w.tope,gastado:w.gastado,bal:w.tope-w.gastado}));
  const cz={
    inicio:c.inicio,fin:c.fin,cobro:c.cobro,tarjeta:c.tarjeta,disponible:c.disponible,gastado,ahorro,
    pct:c.cobro?ahorro/c.cobro:0,diasTotal:dias.length,diasOk:dias.filter(d=>d.ok).length,rachaMax,
    caro:caro&&caro.gasto>0?{f:caro.f,m:caro.gasto}:null,promedio:dias.length?gastado/dias.length:0,
    semanas:semanasC,cats,imp:r.imp,
    tarjetaFijos:tj.filter(g=>g.tipo!=='otra').reduce((a,g)=>a+g.m,0),tarjetaOtros:tj.filter(g=>g.tipo==='otra').reduce((a,g)=>a+g.m,0),
    cuotasPlan:cuotasPlan(),luz:!!c.luz,
    prevGastado:prev?prev.gastado:null,prevAhorro:prev?prev.ahorro:null,transferido:false,logros:[]
  };
  const L=cz.logros;
  if(!prev)L.push('🎉 Primer mes cerrado');
  if(ahorro>0)L.push('🐷 Terminaste el mes con plata');
  if(cz.tarjetaOtros===0)L.push('💳 Tarjeta solo para fijos');
  if(semanasC.every(s=>s.bal>=0))L.push('✉️ Ningún sobre pasado');
  if(rachaMax>=7)L.push('🔥 '+rachaMax+' días seguidos en verde');
  if(prev&&ahorro>prev.ahorro)L.push('📈 Ahorraste más que el mes pasado');
  if(prev&&gastado<prev.gastado)L.push('📉 Gastaste menos que el mes pasado');
  return cz;
}

  const valid=cz.semanas.map((s,i)=>({i,r:s.tope?s.bal/s.tope:0}));

    <div class="row"><span>Pagaste de tarjeta</span><span>${fmt(cz.tarjeta)}</span></div>
    <div class="row"><span>Te quedó para el mes</span><span>${fmt(cz.disponible)}</span></div>
    <div class="row"><span>Gastaste</span><span>${fmt(cz.gastado)}</span></div>

    <div class="row"><span>Días en verde</span><span>${cz.diasOk} de ${cz.diasTotal}</span></div>

  <p class="small">${mejor&&mejor.r>0?'El que mejor cuidaste: '+nombres[mejor.i]+'. ':''}${pasadas.length?'Te pasaste en: '+pasadas.join(', ')+'.':'No te pasaste en ninguno.'}</p></div>

    $('#e-no').onclick=closeSheet;
    $('#e-ok').onclick=()=>{
      const co=Math.max(0,num('#e-c')||0),tj=Math.max(0,num('#e-t')||0),f=$('#e-f').value;
      const nd=co-tj,d=nd-c.disponible;
      if(c.topes[3]+d<0){toast('No alcanza: el sobre libre quedaría en negativo.');return;}
      if(!f||pd(f)<=add(pd(c.inicio),7)){toast('Revisá la fecha del próximo cobro.');return;}
      c.cobro=co;c.tarjeta=tj;c.disponible=nd;c.luz=$('#e-luz').checked;c.topes[3]+=d;c.fin=f;save();closeSheet();render();toast('Mes corregido');
    };
  };
}

function renderCierreGuardado(R){
  const cz=S.historial[param];if(!cz)return go('historial');
  R.innerHTML=`<button class="back" id="b-back">‹ Volver</button>
  <h2>${MESES[pd(cz.inicio).getMonth()][0].toUpperCase()+MESES[pd(cz.inicio).getMonth()].slice(1)} ${pd(cz.inicio).getFullYear()}</h2>
  <div class="small">Del ${corto(pd(cz.inicio))} al ${corto(add(pd(cz.fin),-1))}</div>
  ${htmlCierre(cz)}
  ${cz.ahorro>0?`<label class="check card" style="margin-top:20px"><input type="checkbox" id="c-tr" ${cz.transferido?'checked':''}><span>Pasé ${fmt(cz.ahorro)} a mi cuenta de ahorro</span></label>`:''}`;
  $('#b-back').onclick=()=>go('historial');
  const tr=$('#c-tr');if(tr)tr.onchange=()=>{cz.transferido=tr.checked;save();toast(tr.checked?'¡Bien ahí!':'Marcado como pendiente');};
}

/* ---------- Copias ---------- */
async function backup(){
  const data=JSON.stringify(S,null,1),filename='mi-plata-'+iso(hoyD())+'.json';
  try{
    if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename,data});return;}}
  }catch(e){if(e&&e.code)return toast('No se descargó la copia.');}
  try{
    const file=new File([data],filename,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia de Mi plata'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();
  toast('Copia descargada');
}
$('#restore').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||d.v!==1||!Array.isArray(d.historial))throw 0;
    if(!await ask('¿Restaurar la copia?','Se reemplazan los datos de este celular por los de la copia.','Restaurar'))return;
    S=Object.assign({v:1,ciclo:null,historial:[],baseResumen:157000},d);save();go('home');toast('Copia restaurada');
  }catch(err){toast('Ese archivo no es una copia de Mi plata.');}
  e.target.value='';
};

/* ---------- Hoja ---------- */
function ask(titulo,texto,ok,peligro){
  return new Promise(res=>{
    openSheet(`<h2>${esc(titulo)}</h2><p class="small">${esc(texto)}</p><button class="bigbtn ${peligro?'danger':''}" id="q-ok">${esc(ok)}</button><button class="btn" id="q-no">Cancelar</button>`);
    $('#q-ok').onclick=()=>{closeSheet();res(true);};$('#q-no').onclick=()=>{closeSheet();res(false);};
  });
}
function openSheet(html){$('#panel').innerHTML=html;$('#sheet').classList.add('open');}
function closeSheet(){$('#sheet').classList.remove('open');}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.addEventListener('input',e=>{const el=e.target;if(!el.matches||!el.matches('input[data-money]'))return;const d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,10);el.value=d?Number(d).toLocaleString('es-AR'):'';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});

render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
})();
</script>
